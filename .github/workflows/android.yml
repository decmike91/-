# Construit l'APK de GestSP Mobile à chaque envoi sur GitHub (ou à la demande : onglet Actions › Run workflow).
# L'APK est téléchargeable dans l'onglet Actions › exécution › Artifacts › GestSP-Mobile-apk.
name: GestSP Mobile (APK)

on:
  push:
    paths: ["gsp Android/**", ".github/workflows/android.yml"]
  workflow_dispatch:

jobs:
  apk:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: "gsp Android"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: android-actions/setup-android@v3
      - name: Construire l'APK
        run: |
          chmod +x gradlew
          ./gradlew --no-daemon assembleRelease
          cp app/build/outputs/apk/release/app-release.apk GestSP-Mobile.apk
      - uses: actions/upload-artifact@v4
        with:
          name: GestSP-Mobile-apk
          path: gsp Android/GestSP-Mobile.apk
